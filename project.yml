name: KTStack
options:
  bundleIdPrefix: com.ktstack
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  # Local core package: XPC contract, DNS/TLS constants, paths and version-resolver logic shared
  # by the app, the privileged helper and the resolver CLI. Linked as a product everywhere, so
  # the old share-source-by-path listing in the tool targets is gone.
  KTStackCore:
    path: Packages/Core/KTStackCore
  # Plugin SDK: KTStackPlugin contract, capability protocols, design tokens and KT* shared
  # components. Dynamic product embedded once by the app so feature packages (M04+) link the
  # same copy and capability casts keep one type identity. KTStackKit must never link this.
  KTPluginKit:
    path: Packages/Plugin/KTPluginKit
  # Platform service contracts plugins depend on. Near-empty on purpose: contracts grow one
  # migration at a time (M04+), never ahead of need.
  KTPlatformContracts:
    path: Packages/Contracts/KTPlatformContracts
  # First feature package (M04): Dumps. Automatic product, only the app links it; imports the
  # plugin SDK and contracts, never KTStackKit. See docs/architecture/dependency-rules.md.
  KTDumpsPlugin:
    path: Packages/Features/KTDumpsPlugin
  # Second feature package (M05): Mail. Same shape as Dumps, deps KTPlatformContracts +
  # KTPluginKit only, never KTStackKit. See docs/architecture/dependency-rules.md.
  KTMailPlugin:
    path: Packages/Features/KTMailPlugin
  # Third feature package (M06): Logs. Deps KTStackCore + KTPlatformContracts + KTPluginKit
  # (LogCatalog needs AppSupportPaths), never KTStackKit. See docs/architecture/dependency-rules.md.
  KTLogsPlugin:
    path: Packages/Features/KTLogsPlugin
  # Fourth feature package (M07): Tunnel (headless, no sidebar). Deps KTStackCore +
  # KTPlatformContracts + KTPluginKit, never KTStackKit. See docs/architecture/dependency-rules.md.
  KTTunnelPlugin:
    path: Packages/Features/KTTunnelPlugin
  # Fifth feature package (M08): Doctor. Owns check logic, report and screen; platform exposes
  # probes via DoctorProbing. Deps KTStackCore + KTPlatformContracts + KTPluginKit, never KTStackKit.
  KTDoctorPlugin:
    path: Packages/Features/KTDoctorPlugin
  # Sixth feature package (M09): Database. Owns the four pure-Swift drivers (MySQLNIO, PostgresNIO,
  # GRDB, MongoKitten), editor, backup and NIO event loop; deps KTStackCore + KTPlatformContracts +
  # KTPluginKit, never KTStackKit. The drivers moved here from KTStackKit and now link statically
  # into the app executable, so the bundle stays notarize-clean.
  KTDatabasePlugin:
    path: Packages/Features/KTDatabasePlugin
  # Seventh feature package (M10): Runtimes. Owns the Runtimes screen (PHP/Node rows, Web Server,
  # Databases & Cache) and its sheets; platform keeps RuntimeManager, PHP config and Apache install
  # behind contracts. Deps KTStackCore + KTPlatformContracts + KTPluginKit, never KTStackKit.
  KTRuntimesPlugin:
    path: Packages/Features/KTRuntimesPlugin
  # Eighth feature package (M11): Services. Owns the Services screen (8 service rows, DB/cache version
  # dropdowns, DNS/CA banners, nginx include editor) and its ViewModel; platform keeps ServiceManager,
  # supervision, DNSAutomationService, CATrustService behind contracts. Deps KTStackCore +
  # KTPlatformContracts + KTPluginKit, never KTStackKit.
  KTServicesPlugin:
    path: Packages/Features/KTServicesPlugin
  # Ninth feature package (M12): Sites. Owns the Sites screen (list/grid, New Site, Import, Restore
  # backup, API Tester, share) and its ViewModels; platform keeps provisioning, restore, IDE config,
  # route introspection behind contracts. Deps KTStackCore + KTPlatformContracts + KTPluginKit, never
  # KTStackKit.
  KTSitesPlugin:
    path: Packages/Features/KTSitesPlugin
  # Sparkle auto-update framework (EdDSA-signed appcast). Private key stays offline / in CI;
  # the public key is set as SUPublicEDKey in Info.plist.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: "YES"
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "0.2.9"
    CURRENT_PROJECT_VERSION: "35"
    # Local builds sign ad-hoc; real Developer ID + notarization arrives in Phase 9.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    DEVELOPMENT_TEAM: ""

schemes:
  # Test scheme so `xcodebuild test` can drive the framework's logic tests without an app host.
  KTStackKit-Tests:
    build:
      targets:
        KTStackKit: all
        KTStackKitTests: [test]
    test:
      targets:
        - KTStackKitTests

targets:
  # Shared framework: models, services, drivers. Linked by the app and the tests; the
  # cross-process contract lives in KTStackCore, design tokens and shared components in
  # KTPluginKit.
  KTStackKit:
    type: framework
    platform: macOS
    sources:
      - path: KTStackKit/Sources
    dependencies:
      - package: KTStackCore
      - package: KTPlatformContracts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ktstack.kit
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"

  # Menu-bar accessory app (no Dock icon at idle). UI only — logic lives in KTStackKit.
  KTStack:
    type: application
    platform: macOS
    sources:
      - path: KTStack
        excludes:
          - "Resources/bin/**"
          - "Resources/fonts/**"
      # Folder reference so the vendored binaries keep their `bin/` subdirectory in the
      # bundle (Contents/Resources/bin/), which is where BinaryStager reads them from.
      # The contents are build artifacts produced by scripts/build-*.sh (gitignored).
      - path: KTStack/Resources/bin
        type: folder
        buildPhase: resources
      # Bundled JetBrains Mono faces, kept in a fonts/ subdirectory so Info.plist's
      # ATSApplicationFontsPath can auto-activate them at launch.
      - path: KTStack/Resources/fonts
        type: folder
        buildPhase: resources
      # SMAppService reads the daemon plist from Contents/Library/LaunchDaemons. Without this copy
      # register() throws "unable to read plist" and DNS enable silently fails on signed builds.
      - path: KTStackHelper/com.ktstack.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: KTStackKit
        embed: true
      - package: KTStackCore
        embed: true
      - package: KTPluginKit
        embed: true
      # Dynamic contracts product embedded once here; KTStackKit and feature packages link the
      # same copy so protocol conformances keep one type identity across the boundary.
      - package: KTPlatformContracts
        embed: true
      - package: KTDumpsPlugin
      - package: KTMailPlugin
      - package: KTLogsPlugin
      - package: KTTunnelPlugin
      - package: KTDoctorPlugin
      - package: KTDatabasePlugin
      - package: KTRuntimesPlugin
      - package: KTServicesPlugin
      - package: KTSitesPlugin
      - package: Sparkle
      # Build-order + copy only (no linking); lands in Contents/MacOS so Phase 4's
      # SMAppService daemon plist can reference it. Empty stub for now.
      - target: KTStackHelper
        link: false
        copy:
          destination: executables
      # Tiny CLI the shell shims exec to resolve per-project runtime versions. Uses the same
      # KTStackCore resolver core as the app so terminal and web pick the same PHP version.
      - target: ktstack-resolve
        link: false
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ktstack.app
        # Legacy com.kdwarm.* installs (data dir, launchd jobs, keychain, defaults) are carried over
        # once at first launch by LegacyKDWarmMigration.
        PRODUCT_NAME: KTStack
        INFOPLIST_FILE: KTStack/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: entitlements/app.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  # Privileged helper (root). XPC DNS surface. SMAppService daemon layout in place; live
  # registration gated on Developer ID signing (Phase 9). Links KTStackCore for the XPC contract
  # and DNS/TLS constants so identity/requirement constants are single-sourced and can't drift.
  KTStackHelper:
    type: tool
    platform: macOS
    sources:
      - path: KTStackHelper
        excludes:
          - "com.ktstack.helper.plist"   # embedded in the app bundle, not compiled into the tool
    dependencies:
      - package: KTStackCore
        product: KTStackCoreStatic
    preBuildScripts:
      - name: Require team for Developer ID signing
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CODE_SIGN_IDENTITY}" != "-" ] && printf '%s' "${CODE_SIGN_IDENTITY}" | grep -qi "Developer ID" && [ -z "${DEVELOPMENT_TEAM}" ]; then
            echo "error: a Developer ID signed helper requires DEVELOPMENT_TEAM to be set"
            exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ktstack.helper
        CODE_SIGN_ENTITLEMENTS: entitlements/helper.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"

  # Shell-shim resolver CLI. Links KTStackCore for the resolver core so the per-project version
  # logic is single-sourced between the terminal shims and the app's php-fpm pool selection.
  ktstack-resolve:
    type: tool
    platform: macOS
    sources:
      - path: KTStackResolve
    dependencies:
      - package: KTStackCore
        product: KTStackCoreStatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ktstack.resolve
        CODE_SIGN_ENTITLEMENTS: entitlements/helper.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"

  # Logic tests for the framework (config writers, paths, pool/preflight). Runs without an
  # app host — pure XCTest against KTStackKit.
  KTStackKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KTStackKitTests
    dependencies:
      - target: KTStackKit
      - package: KTStackCore
      - package: KTPlatformContracts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ktstack.kit.tests
        GENERATE_INFOPLIST_FILE: "YES"
