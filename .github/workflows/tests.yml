# Mirrors scripts/ci-local.sh minus lint (see lint.yml): the `tests` job is the --quick gate
# (architecture-check → package tests → KTStackKit-Tests); `release-build` and `thread-sanitizer`
# mirror the full gate. Change one, change the other.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: brew install xcodegen
      # Folder reference in project.yml; its contents are gitignored build artifacts.
      - run: mkdir -p KTStack/Resources/bin
      - run: scripts/architecture-check.sh
      - run: scripts/release/tests/test-update-appcast.sh
      - uses: actions/cache@v4
        with:
          path: Packages/*/*/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/*/*/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Package tests
        run: |
          for pkg in Packages/Core/*/ Packages/Contracts/*/ Packages/Plugin/*/ Packages/Features/*/; do
            [ -d "${pkg}Tests" ] || continue
            swift test --package-path "$pkg"
          done
      - run: xcodegen generate
      - name: KTStackKit-Tests
        run: |
          (
            last=0; idle=0
            while sleep 30; do
              size=$(stat -f %z /tmp/xc.log 2>/dev/null || echo 0)
              if [ "$size" = "$last" ]; then idle=$((idle+30)); else idle=0; last=$size; fi
              if [ $idle -ge 180 ]; then
                for pid in $(pgrep -f xctest); do
                  echo "=== sample $pid ==="; sample "$pid" 3 -mayDie 2>&1 | head -700
                done
                pkill -f xctest; break
              fi
            done
          ) &
          xcodebuild -project KTStack.xcodeproj -scheme KTStackKit-Tests -destination 'platform=macOS' -derivedDataPath .build-ci test 2>&1 | tee /tmp/xc.log
          exit ${PIPESTATUS[0]}

  release-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: mkdir -p KTStack/Resources/bin
      - run: xcodegen generate
      - name: Release build (KTStack)
        run: >
          xcodebuild -project KTStack.xcodeproj -scheme KTStack -destination 'platform=macOS'
          -configuration Release -derivedDataPath .build-release build
          CODE_SIGNING_ALLOWED=NO

  # Reporting-only until the strict-concurrency pass (plan 3.1) clears the existing races; flip
  # continue-on-error off once it is green.
  thread-sanitizer:
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: mkdir -p KTStack/Resources/bin
      - run: xcodegen generate
      - name: KTStackKit-Tests (TSan)
        run: >
          xcodebuild -project KTStack.xcodeproj -scheme KTStackKit-Tests -destination 'platform=macOS'
          -derivedDataPath .build-tsan -enableThreadSanitizer YES test
